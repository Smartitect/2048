<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the facts come from</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #181a1d;
      --color-muted:  #636871;
      --color-accent: #60991a;
      --font-sans:  'Inter', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  "Consolas", "Menlo", "Inconsolata", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Monaco", monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · py2048</p>
    <h1>Where the facts come from</h1>

    <svg viewBox="0 0 1160 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-prov-title state-prov-desc">
      <title id="state-prov-title">Where the facts come from</title>
      <desc id="state-prov-desc">Every figure sent to the AI player is derived by copying the live board, playing one direction on the copy, and measuring the result: what the move certainly does, and separately the one fact that is a risk rather than a certainty — whether a spawn on the resulting board could leave no legal move.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#636871"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60991a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- zone -->
      <rect x="856" y="68" width="280" height="312" rx="8" fill="rgba(24,26,29,0.02)" stroke="rgba(24,26,29,0.10)" stroke-width="0.8"/>
      <rect x="872" y="72" width="164" height="12" rx="2" fill="#fafafa"/>
      <text x="954" y="81" fill="rgba(24,26,29,0.45)" font-size="7" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">AVAILABLE_MOVES[DIRECTION]</text>

      <!-- arrows -->
      <line x1="240" y1="228" x2="320" y2="228" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="208" width="64" height="12" rx="2" fill="#fafafa"/>
      <text x="280" y="217" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">EXPORT_STATE</text>

      <line x1="500" y1="228" x2="580" y2="228" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="518" y="208" width="44" height="12" rx="2" fill="#fafafa"/>
      <text x="540" y="217" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PLAY IT</text>

      <path d="M 760,212 H 812 Q 820,212 820,204 V 168 Q 820,160 828,160 H 880" fill="none" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760,244 H 812 Q 820,244 820,252 V 308 Q 820,316 828,316 H 880" fill="none" stroke="#60991a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- nodes -->
      <rect x="60" y="180" width="180" height="96" rx="6" fill="#fafafa"/>
      <rect x="60" y="180" width="180" height="96" rx="6" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <rect x="68" y="188" width="34" height="12" rx="2" fill="transparent" stroke="rgba(24,26,29,0.40)" stroke-width="0.8"/>
      <text x="85" y="197" fill="rgba(24,26,29,0.80)" font-size="7" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">BOARD</text>
      <text x="150" y="226" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">The live game</text>
      <text x="150" y="246" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">asking never changes it</text>
      <text x="150" y="262" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">score · grid · merges</text>

      <rect x="320" y="196" width="180" height="64" rx="6" fill="#fafafa"/>
      <rect x="320" y="196" width="180" height="64" rx="6" fill="rgba(24,26,29,0.05)" stroke="#636871" stroke-width="1"/>
      <text x="410" y="222" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">A copy</text>
      <text x="410" y="240" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">one per legal direction</text>

      <rect x="580" y="196" width="180" height="64" rx="6" fill="#fafafa"/>
      <rect x="580" y="196" width="180" height="64" rx="6" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <text x="670" y="222" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">The engine plays it</text>
      <text x="670" y="240" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">make_move(direction)</text>

      <rect x="880" y="100" width="240" height="120" rx="6" fill="#fafafa"/>
      <rect x="880" y="100" width="240" height="120" rx="6" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <rect x="888" y="108" width="44" height="12" rx="2" fill="transparent" stroke="rgba(24,26,29,0.40)" stroke-width="0.8"/>
      <text x="910" y="117" fill="rgba(24,26,29,0.80)" font-size="7" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CERTAIN</text>
      <text x="1000" y="140" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">What it does</text>
      <text x="1000" y="160" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">points_gained · tiles_merged</text>
      <text x="1000" y="176" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">empty_cells_after</text>
      <text x="1000" y="192" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">moves_available_after</text>
      <text x="1000" y="208" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">monotonicity_after</text>

      <rect x="880" y="268" width="240" height="96" rx="6" fill="#fafafa"/>
      <rect x="880" y="268" width="240" height="96" rx="6" fill="rgba(120,191,32,0.14)" stroke="#60991a" stroke-width="1.2"/>
      <rect x="888" y="276" width="30" height="12" rx="2" fill="transparent" stroke="rgba(96,153,26,0.55)" stroke-width="0.8"/>
      <text x="903" y="285" fill="#4d7d13" font-size="7" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">RISK</text>
      <text x="1000" y="308" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">What it risks</text>
      <text x="1000" y="328" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">could_end_the_game</text>
      <text x="1000" y="348" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">one cell left? try a 2, try a 4</text>

      <!-- callout -->
      <text x="60" y="428" fill="#636871" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The engine does the arithmetic, so the model judges facts rather than imagining them.</text>
      <text x="60" y="450" fill="#858891" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The spawn is random, so it is never stated as a consequence — only as a risk.</text>

      <!-- legend -->
      <line x1="60" y1="472" x2="1136" y2="472" stroke="rgba(24,26,29,0.10)" stroke-width="0.8"/>
      <text x="60" y="492" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="160" y="484" width="10" height="10" rx="2" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <text x="178" y="492" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">MEASURED ON A COPY</text>
      <rect x="400" y="484" width="10" height="10" rx="2" fill="rgba(120,191,32,0.14)" stroke="#60991a" stroke-width="1"/>
      <text x="418" y="492" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">RISK, NOT PREDICTION</text>
      <rect x="640" y="484" width="10" height="10" rx="2" fill="rgba(24,26,29,0.05)" stroke="#636871" stroke-width="1"/>
      <text x="658" y="492" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">THROWAWAY STATE</text>

      <!-- endjin wordmark, from endjin.com -->

  </div>
