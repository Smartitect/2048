<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One move, chosen by Jev</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #181a1d;
      --color-muted:  #636871;
      --color-accent: #60991a;
      --font-sans:  'Inter', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  "Consolas", "Menlo", "Inconsolata", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Monaco", monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · py2048</p>
    <h1>One move, chosen by Jev</h1>

    <svg viewBox="0 0 1080 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-move-title ai-move-desc">
      <title id="ai-move-title">One move, chosen by Jev</title>
      <desc id="ai-move-desc">Sequence of one AI move in py2048: the browser starts the agent, and then for each move the web API asks the AI player to choose, the player plays every legal direction on a copy of the board to gather facts, sends them to TypeSafe AI's Jev, returns a direction, and the engine plays it before the new state is pushed back to the browser over server-sent events.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#636871"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60991a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0095ff"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- loop fragment frame -->
      <rect x="94" y="214" width="892" height="420" rx="4" fill="rgba(24,26,29,0.02)" stroke="rgba(24,26,29,0.22)" stroke-width="1"/>
      <rect x="94" y="214" width="40" height="16" rx="2" fill="#fafafa" stroke="rgba(24,26,29,0.22)" stroke-width="1"/>
      <text x="114" y="226" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <rect x="140" y="238" width="152" height="12" rx="2" fill="#fafafa"/>
      <text x="140" y="247" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" letter-spacing="0.04em">[each move, until game over]</text>

      <!-- lifelines -->
      <line x1="110" y1="136" x2="110" y2="660" stroke="rgba(24,26,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="330" y1="136" x2="330" y2="660" stroke="rgba(24,26,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="560" y1="136" x2="560" y2="660" stroke="rgba(24,26,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="760" y1="136" x2="760" y2="660" stroke="rgba(24,26,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="970" y1="136" x2="970" y2="660" stroke="rgba(24,26,29,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation bars -->
      <rect x="326" y="190" width="8" height="430" fill="rgba(24,26,29,0.06)" stroke="#636871" stroke-width="0.8"/>
      <rect x="556" y="274" width="8" height="212" fill="rgba(24,26,29,0.06)" stroke="#636871" stroke-width="0.8"/>
      <rect x="966" y="402" width="8" height="40" fill="rgba(24,26,29,0.06)" stroke="#636871" stroke-width="0.8"/>
      <rect x="756" y="318" width="8" height="40" fill="rgba(24,26,29,0.06)" stroke="#636871" stroke-width="0.8"/>
      <rect x="756" y="526" width="8" height="40" fill="rgba(24,26,29,0.06)" stroke="#636871" stroke-width="0.8"/>

      <!-- messages -->
      <line x1="110" y1="190" x2="322" y2="190" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="190" y="170" width="60" height="12" rx="2" fill="#fafafa"/>
      <text x="220" y="179" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">START AGENT</text>

      <line x1="334" y1="274" x2="552" y2="274" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="410" y="254" width="70" height="12" rx="2" fill="#fafafa"/>
      <text x="445" y="263" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CHOOSE(BOARD)</text>

      <line x1="564" y1="318" x2="752" y2="318" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="622" y="298" width="76" height="12" rx="2" fill="#fafafa"/>
      <text x="660" y="307" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PLAY ON A COPY</text>

      <line x1="752" y1="358" x2="564" y2="358" stroke="#636871" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="624" y="338" width="72" height="12" rx="2" fill="#fafafa"/>
      <text x="660" y="347" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">MOVE OUTCOMES</text>

      <line x1="564" y1="402" x2="962" y2="402" stroke="#0095ff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="832" y="382" width="56" height="12" rx="2" fill="#fafafa"/>
      <text x="860" y="391" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SYSTEM_ONE</text>

      <line x1="962" y1="442" x2="564" y2="442" stroke="#0095ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="826" y="422" width="68" height="12" rx="2" fill="#fafafa"/>
      <text x="860" y="431" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CHOICE + CONF</text>

      <line x1="552" y1="486" x2="338" y2="486" stroke="#636871" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="420" y="466" width="50" height="12" rx="2" fill="#fafafa"/>
      <text x="445" y="475" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">DIRECTION</text>

      <line x1="334" y1="526" x2="752" y2="526" stroke="#636871" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="416" y="506" width="50" height="12" rx="2" fill="#fafafa"/>
      <text x="441" y="515" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">MAKE_MOVE</text>

      <line x1="752" y1="566" x2="338" y2="566" stroke="#636871" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="636" y="546" width="32" height="12" rx="2" fill="#fafafa"/>
      <text x="652" y="555" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">MOVED</text>

      <line x1="322" y1="606" x2="118" y2="606" stroke="#60991a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="196" y="586" width="48" height="12" rx="2" fill="#fafafa"/>
      <text x="220" y="595" fill="#4d7d13" font-size="8" font-family="Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SSE STATE</text>

      <!-- actors -->
      <rect x="40" y="80" width="140" height="56" rx="6" fill="#fafafa"/>
      <rect x="40" y="80" width="140" height="56" rx="6" fill="rgba(99,104,113,0.10)" stroke="#858891" stroke-width="1"/>

      <text x="110" y="122" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">index.html</text>

      <rect x="260" y="80" width="140" height="56" rx="6" fill="#fafafa"/>
      <rect x="260" y="80" width="140" height="56" rx="6" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <text x="330" y="106" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Web API</text>
      <text x="330" y="122" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">web/app.py</text>

      <rect x="490" y="80" width="140" height="56" rx="6" fill="#fafafa"/>
      <rect x="490" y="80" width="140" height="56" rx="6" fill="#ffffff" stroke="#181a1d" stroke-width="1"/>
      <text x="560" y="106" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">AI player</text>
      <text x="560" y="122" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">agent/</text>

      <rect x="690" y="80" width="140" height="56" rx="6" fill="#fafafa"/>
      <rect x="690" y="80" width="140" height="56" rx="6" fill="rgba(120,191,32,0.14)" stroke="#60991a" stroke-width="1.2"/>
      <text x="760" y="106" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Board</text>
      <text x="760" y="122" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">engine.py</text>

      <rect x="900" y="80" width="140" height="56" rx="6" fill="#fafafa"/>
      <rect x="900" y="80" width="140" height="56" rx="6" fill="rgba(24,26,29,0.03)" stroke="rgba(24,26,29,0.30)" stroke-width="1"/>
      <text x="970" y="106" fill="#181a1d" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Jev</text>
      <text x="970" y="122" fill="#636871" font-size="9" font-family="Consolas, Menlo, monospace" text-anchor="middle">TypeSafe AI</text>

      <!-- legend -->
      <line x1="40" y1="690" x2="1040" y2="690" stroke="rgba(24,26,29,0.10)" stroke-width="0.8"/>
      <text x="40" y="710" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="707" x2="168" y2="707" stroke="#636871" stroke-width="1.2"/>
      <text x="176" y="710" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">CALL</text>
      <line x1="300" y1="707" x2="328" y2="707" stroke="#636871" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="336" y="710" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">RETURN</text>
      <line x1="470" y1="707" x2="498" y2="707" stroke="#0095ff" stroke-width="1.2"/>
      <text x="506" y="710" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">HTTPS CALL</text>

      <text x="696" y="710" fill="#636871" font-size="8" font-family="Consolas, Menlo, monospace">STATE THE PAGE RENDERS</text>
