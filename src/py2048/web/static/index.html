<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>py2048</title>
<style>
  :root {
    --background: #faf8ef;
    --board: #bcada0;
    --empty: #cec0b3;
    --text-dark: #776e64;
    --text-light: #ffffff;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--background);
    color: var(--text-dark);
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 40px; margin: 0 0 4px; letter-spacing: -1px; }
  .subtitle { margin: 0 0 20px; font-size: 14px; opacity: 0.8; }
  .metrics { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .metric {
    background: var(--board); color: var(--text-light);
    border-radius: 6px; padding: 8px 16px; min-width: 88px; text-align: center;
  }
  .metric span { display: block; }
  .metric .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
  .metric .value { font-size: 22px; font-weight: 700; }
  .board-wrapper { position: relative; }
  .board {
    background: var(--board); border-radius: 8px; padding: var(--gap);
    display: grid; grid-template-columns: repeat(4, 100px); gap: var(--gap);
  }
  .cell {
    width: 100px; height: 100px; border-radius: 4px;
    background: var(--empty); color: var(--text-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px;
    background: rgba(238, 228, 218, 0.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 40px; }
  .controls { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    background: #8e7a66; color: var(--text-light);
    border: 0; border-radius: 6px; padding: 10px 18px;
  }
  button:hover { background: #7d6a58; }
  .hint { margin-top: 18px; font-size: 13px; opacity: 0.75; text-align: center; }
  .decision {
    margin-top: 18px; width: 460px; max-width: 100%;
    background: #ede4da; border-radius: 8px; padding: 14px 16px;
  }
  .decision[hidden] { display: none; }
  .decision-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; margin-bottom: 10px; font-size: 13px;
  }
  .decision-head strong { font-size: 15px; }
  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 4px; background: #8e7a66; color: #fff;
  }
  .badge.fallback { background: #b04a3a; }
  .badge.human { background: #6f8f6a; }
  .bar-row { display: grid; grid-template-columns: 54px 1fr 44px; gap: 8px; align-items: center;
             font-size: 12px; margin-bottom: 4px; }
  .bar { background: #d8ccc0; border-radius: 3px; height: 14px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: #8e7a66; }
  .bar-row.picked span { background: #f2b179; }
  .reason { margin: 8px 0 0; font-size: 12px; color: #8a4433; }
  .status { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .status.offline { color: #b04a3a; font-weight: 700; }
  @media (max-width: 480px) {
    .board { grid-template-columns: repeat(4, 70px); }
    .cell { width: 70px; height: 70px; font-size: 22px; }
  }
</style>
</head>
<body>
  <h1>2048</h1>
  <p class="subtitle">The Python engine is playing; this page is only watching.</p>

  <div class="metrics">
    <div class="metric"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="metric"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
    <div class="metric"><span class="label">Merges</span><span class="value" id="merges">0</span></div>
    <div class="metric"><span class="label">Max tile</span><span class="value" id="max-tile">0</span></div>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <h2>Game over</h2>
      <p id="final">No moves remain.</p>
      <button id="overlay-new">New game</button>
    </div>
  </div>

  <div class="controls">
    <button id="agent-toggle">Let Jev play</button>
    <label class="hint" for="interval">every</label>
    <select id="interval">
      <option value="0.25">0.25s</option>
      <option value="0.5">0.5s</option>
      <option value="1" selected>1s</option>
      <option value="2">2s</option>
    </select>
    <button id="new-game">New game</button>
  </div>

  <div class="decision" id="decision" hidden>
    <div class="decision-head">
      <strong id="decision-move">-</strong>
      <span id="decision-meta"></span>
      <span class="badge" id="decision-source">jev</span>
    </div>
    <div id="decision-bars"></div>
    <p class="reason" id="decision-reason" hidden></p>
  </div>

  <p class="hint">Arrow keys to play. W A S D works too.</p>
  <p class="status" id="status"></p>

<script>
  // Tile colours, keyed by value. Anything above 2048 keeps the top colour.
  const TILE_STYLES = {
    2: ["#eee5da", "#776e64"], 4: ["#eee1c7", "#776e64"],
    8: ["#f2b179", "#ffffff"], 16: ["#f59563", "#ffffff"],
    32: ["#f57c5f", "#ffffff"], 64: ["#f45c3d", "#ffffff"],
    128: ["#edd073", "#ffffff"], 256: ["#edcc62", "#ffffff"],
    512: ["#edc850", "#ffffff"], 1024: ["#edc53f", "#ffffff"],
    2048: ["#edc22e", "#ffffff"], 4096: ["#238c51", "#ffffff"],
    8192: ["#1982cd", "#ffffff"]
  };

  const KEY_MOVES = {
    ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
    w: "UP", s: "DOWN", a: "LEFT", d: "RIGHT",
    W: "UP", S: "DOWN", A: "LEFT", D: "RIGHT"
  };

  let agentRunning = false;
  const board = document.getElementById("board");
  const overlay = document.getElementById("overlay");
  const status = document.getElementById("status");

  const cells = [];
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    board.appendChild(cell);
    cells.push(cell);
  }

  function render(state) {
    // The grid arrives as grid[y][x], the same way round the engine holds it.
    state.grid.flat().forEach((value, index) => {
      const cell = cells[index];
      const [fill, text] = TILE_STYLES[value] || ["#125b92", "#ffffff"];
      cell.textContent = value === null ? "" : value;
      cell.style.background = value === null ? "var(--empty)" : fill;
      cell.style.color = text;
    });
    document.getElementById("score").textContent = state.score;
    document.getElementById("moves").textContent = state.moves;
    document.getElementById("merges").textContent = state.mergeCount;
    document.getElementById("max-tile").textContent = state.maxTile;
    document.getElementById("final").textContent =
      `Score ${state.score} in ${state.moves} moves.`;
    overlay.hidden = !state.gameOver;
    renderDecision(state);
    renderAgent(state);
  }

  const RISK_WORDS = ["room to work", "getting crowded", "nearly stuck"];

  function renderDecision(state) {
    const decision = state.decision;
    const panel = document.getElementById("decision");
    if (!decision) { panel.hidden = true; return; }
    panel.hidden = false;

    document.getElementById("decision-move").textContent = decision.move || "no move";

    const source = document.getElementById("decision-source");
    source.textContent = decision.source;
    source.className = "badge " + decision.source;

    const bits = [];
    if (decision.confidence !== null && decision.confidence !== undefined) {
      bits.push(`confidence ${decision.confidence.toFixed(2)}`);
    }
    if (decision.risk !== null && decision.risk !== undefined) {
      const word = RISK_WORDS[Math.round(decision.risk)] || "";
      bits.push(`risk ${decision.risk.toFixed(2)} (${word})`);
    }
    if (decision.latencyMs) bits.push(`${decision.latencyMs} ms`);
    document.getElementById("decision-meta").textContent = bits.join(" \u00b7 ");

    const bars = document.getElementById("decision-bars");
    bars.innerHTML = "";
    const probabilities = decision.probabilities || {};
    for (const [direction, probability] of Object.entries(probabilities)) {
      const row = document.createElement("div");
      row.className = "bar-row" + (direction === decision.move ? " picked" : "");
      row.innerHTML =
        `<span>${direction}</span>` +
        `<span class="bar"><span style="width:${(probability * 100).toFixed(1)}%"></span></span>` +
        `<span>${(probability * 100).toFixed(0)}%</span>`;
      bars.appendChild(row);
    }

    const reason = document.getElementById("decision-reason");
    reason.hidden = !decision.reason;
    reason.textContent = decision.reason ? `Fell back: ${decision.reason}` : "";
  }

  function renderAgent(state) {
    const agent = state.agent || {};
    agentRunning = !!agent.running;
    const button = document.getElementById("agent-toggle");
    button.textContent = agentRunning ? "Stop Jev" : "Let Jev play";
    if (!agent.keyConfigured) {
      button.title = "No TYPESAFE_API_KEY set - a local fallback policy will play instead";
    }
  }

  async function send(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {})
    });
    if (!response.ok) {
      status.textContent = `Request failed: ${response.status}`;
      return null;
    }
    return response.json();
  }

  document.addEventListener("keydown", (event) => {
    const move = KEY_MOVES[event.key];
    if (!move) return;
    event.preventDefault();          // stop the arrow keys scrolling the page
    send("/api/move", {direction: move});
  });

  document.getElementById("new-game").addEventListener("click", () => send("/api/new"));

  document.getElementById("agent-toggle").addEventListener("click", () => {
    const interval = parseFloat(document.getElementById("interval").value);
    send(agentRunning ? "/api/agent/stop" : "/api/agent/start", {intervalSeconds: interval});
  });
  document.getElementById("overlay-new").addEventListener("click", () => send("/api/new"));

  // State arrives by push. Every change on the server reaches every open tab,
  // so two windows stay in step and an engine playing itself needs nothing more.
  function listen() {
    const events = new EventSource("/api/events");
    events.onmessage = (event) => {
      status.textContent = "";
      status.className = "status";
      render(JSON.parse(event.data));
    };
    events.onerror = () => {
      status.textContent = "Connection lost - retrying.";
      status.className = "status offline";
      events.close();
      setTimeout(listen, 2000);
    };
  }

  fetch("/api/state").then((response) => response.json()).then(render);
  listen();
</script>
</body>
</html>
